{% extends "base.html" %}
{% block title %}Nova caçamba{% endblock %}
{% block content %}
<section class="page-head">
  <div>
    <h2>Cadastrar caçamba</h2>
    <p>Use o número real da unidade. A capacidade permitida é 3 m³ ou 4 m³.</p>
  </div>
</section>

<div class="card form-card">
  <form method="post">
    <div class="form-grid">
      <div>
        <label for="codigo">Número ou código *</label>
        <input id="codigo" name="codigo" required placeholder="Ex.: 6 ou C-12" autocomplete="off">
      </div>
      <div>
        <label for="capacidade_m3">Capacidade *</label>
        <select id="capacidade_m3" name="capacidade_m3" required>
          <option value="">Escolha</option>
          <option value="3">3 m³</option>
          <option value="4">4 m³</option>
        </select>
      </div>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn">Salvar caçamba</button>
      <a class="btn btn-sec" href="{{ url_for('cacambas') }}">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
