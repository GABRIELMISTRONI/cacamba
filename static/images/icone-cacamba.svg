<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Caçambas">
  <!-- Fundo com gradiente laranja -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e06820"/>
      <stop offset="100%" stop-color="#b84a0e"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e8e8e8"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.35)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>
  <!-- Fundo arredondado -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- Reflexo sutil no topo -->
  <rect width="64" height="30" rx="14" fill="url(#shine)"/>

  <!-- Corpo da caçamba trapezoidal -->
  <path d="M11 25 L17 44 L47 44 L53 25 Z" fill="url(#body)" rx="2"/>
  <!-- Borda superior / aba da caçamba -->
  <rect x="9" y="21" width="46" height="6" rx="2" fill="#f0f0f0"/>
  <!-- Sombra interna da caçamba (volume) -->
  <path d="M17 44 L20 33 L44 33 L47 44 Z" fill="rgba(0,0,0,0.07)"/>
  <!-- Divisórias internas -->
  <line x1="27" y1="25" x2="24" y2="44" stroke="rgba(0,0,0,0.12)" stroke-width="1.2"/>
  <line x1="37" y1="25" x2="40" y2="44" stroke="rgba(0,0,0,0.12)" stroke-width="1.2"/>
  <!-- Pernas / suporte -->
  <rect x="16" y="44" width="4" height="5" rx="1" fill="#d0d0d0"/>
  <rect x="44" y="44" width="4" height="5" rx="1" fill="#d0d0d0"/>
  <!-- Listras de sinalização laranja na lateral da caçamba -->
  <path d="M13 30 L15.5 30 L14.2 36 L11.7 36 Z" fill="#e06820" opacity="0.6"/>
  <path d="M50.5 30 L53 30 L52 36 L49.5 36 Z" fill="#e06820" opacity="0.6"/>
</svg>
